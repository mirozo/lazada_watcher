[project]
name = "lazada-watcher"
version = "0.1.0"
description = "Watch Lazada SG listings for restocks and alert via Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "patchright>=1.55",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",

]

[project.scripts]
lazada-watcher = "lazada_watcher.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
